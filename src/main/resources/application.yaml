springdoc:
  swagger-ui:
    enabled: false


spring:
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: language-learner
        version: 1.0.0
        type: SYNC
        instructions: Fetch pending vocabulary cloze work before storing generated results.
        capabilities:
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${api-keys:}
      chat:
        options:
          model: deepseek-v4-pro
        completions-path: /chat/completions
  config:
    import: optional:classpath:.env.local[.properties]
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

llm:
  model-demo: deepseek-v4-pro
  model-fast: deepseek-v4-flash

content-generation:
  reading-paragraph-cloze-provider: MCP

mcp:
  public-url: ${MCP_PUBLIC_URL:http://localhost:8080/mcp}

api-keys: >-
  ${DEEPSEEK_API_KEY:}
