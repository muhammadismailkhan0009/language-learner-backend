feature:
  id: grammar_user_level_alignment_upgrade_v1
  phase: 2
  status: draft

backend_architecture:
  owning_capabilities:
    grammar: language_learning_system.grammar_rules
    profile: user_management.user_profile
  supporting_capability: language_content.llm
  rule: >
    Keep grammar-level reassignment in the existing grammar_rules vertical slice
    and profile commands in user_management. Manual grammar editing already exists,
    so it is a no-op in this feature and must not be modified.

  shared_constants:
    planned_components:
      - name: LanguageLevel
        placement: common/enums/LanguageLevel.java
        role: enum-backed CEFR levels A1, A2, B1, B2, C1
      - name: GrammarRuleStatus
        placement: language_learning_system/domain/grammar_rules/model/GrammarRuleStatus.java
        role: replace local string constants for DRAFT and READY where touched
    persistence_rule: persist enum values as strings only; never ordinal.

  authorization_boundary:
    planned_component:
      name: GrammarContentAuthorizationService
      placement: language_learning_system/application/services/grammar_rules/GrammarContentAuthorizationService.java
      role: centralize current "any authenticated user" decision for grammar reassignment
    profile_auth_rule: profile endpoints resolve and update only the current authenticated user's profile.

  grammar_api_boundary:
    existing_endpoints:
      - GET /api/v1/grammar-rules/v1
      - GET /api/v1/grammar-rules/{grammarRuleId}/v1
    planned_endpoint:
      method: POST
      path: /api/v1/grammar-rules/reassign-levels/v1
      response: ApiResponse<GrammarLevelReassignmentSummaryResponse>
    planned_changes:
      - normalize response levels from LanguageLevel values
    placement:
      controller: language_learning_system/application/controllers/grammar_rules/GrammarRuleController.java
      requests: language_learning_system/application/controllers/grammar_rules/request
      responses: language_learning_system/application/controllers/grammar_rules/response
      service: language_learning_system/application/services/grammar_rules/GrammarRuleOrchestrationService.java
      mapper: language_learning_system/application/mappers/grammar_rules/GrammarRuleApiMapper.java

  grammar_application_orchestration:
    planned_components:
      - name: GrammarLevelReassignmentService
        placement: language_learning_system/application/services/grammar_rules/GrammarLevelReassignmentService.java
        role: load catalog, call LLM port once, validate results, update changed levels, produce summary
      - name: GrammarLevelReassignmentValidator
        placement: language_learning_system/application/services/grammar_rules/GrammarLevelReassignmentValidator.java
        role: reject unknown IDs, duplicate IDs, and unsupported enum values; allow omitted rules unchanged
    dependency_rule: application code depends on grammar repo and LLM API interface only, not concrete LLM infra.
    existing_behavior_noop:
      - GrammarRuleOrchestrationService.editGrammarRule already exists and is not modified by this feature.
      - GrammarRuleDomainService edit behavior already exists and is not modified by this feature.
      - Existing deleteGrammarRuleExplanation remains unchanged because deletion is out of feature scope.

  grammar_domain_model:
    planned_changes:
      - file: language_learning_system/domain/grammar_rules/model/GrammarRule.java
        role: represent level with LanguageLevel where feasible, or enforce LanguageLevel at domain boundary if migration blast radius is too high
      - file: language_learning_system/domain/grammar_rules/services/GrammarRuleDomainService.java
        role: provide or reuse valid LanguageLevel handling for reassignment only if needed without changing manual edit behavior
      - file: language_learning_system/domain/grammar_rules/repo/GrammarRuleRepo.java
        role: existing save/findAll/findById methods are sufficient for reassignment
    no_new_repo_method_required: true

  grammar_persistence:
    existing_table: grammar_rule
    planned_change:
      - ensure level values are valid LanguageLevel strings
      - no new grammar table for reassignment history
      - no rule IDs are regenerated by reassignment
    jpa_placement:
      entity: language_learning_system/infra/jpa/grammar_rules/entities/GrammarRuleEntity.java
      mapper: language_learning_system/infra/jpa/grammar_rules/mappers/GrammarRuleJpaMapper.java
      repository_impl: language_learning_system/infra/jpa/grammar_rules/GrammarRuleJpaRepoImpl.java

  grammar_llm_boundary:
    application_api:
      placement: language_content/application/externals
      planned_contracts:
        - GrammarLevelReassignmentLlmApi
        - GrammarLevelReassignmentInput
        - GrammarLevelReassignmentProposal
    adapter:
      placement: language_content/application/services or language_content/infra/llm adapter matching existing LLMGenerator pattern
      role: issue one structured-output call using the feature prompt and return DTOs only
    prompt_rule: prompt and provider parsing stay outside grammar domain; reassignment service owns validation and update decisions.

  user_profile_api_boundary:
    planned_endpoints:
      - method: GET
        path: /api/v1/users/me/profile
        response: ApiResponse<UserProfileResponse>
      - method: PATCH
        path: /api/v1/users/me/profile/difficulty-level
        request: UpdateUserDifficultyLevelRequest
        response: ApiResponse<UserProfileResponse>
    placement:
      controller: user_management/application/endpoints/user_profile/UserProfileController.java
      requests: user_management/application/endpoints/user_profile/request
      responses: user_management/application/endpoints/user_profile/response
      service: user_management/application/services/UserProfileService.java

  user_profile_domain_and_repo:
    planned_components:
      - name: UserProfile
        placement: user_management/domain/model/UserProfile.java
        role: userId, LanguageLevel difficultyLevel, createdAt, updatedAt
      - name: UserProfileRepo
        placement: user_management/domain/repo/UserProfileRepo.java
        role: findByUserId and save profile
      - name: UserProfileEntity
        placement: user_management/infra/jpa/entities/UserProfileEntity.java
        role: persist profile with unique user_id and enum string difficulty_level
      - name: UserProfileJpaRepo
        placement: user_management/infra/jpa/repos/UserProfileJpaRepo.java
        role: Spring Data adapter backing UserProfileRepo implementation
    migration:
      planned_file: src/main/resources/db/migration/V17__user_profiles.sql
      table: user_profiles
      columns:
        - user_id primary/unique reference-compatible string
        - difficulty_level varchar not null default A1
        - created_at timestamp not null
        - updated_at timestamp not null
    no_progress_side_effects: profile service must not depend on vocabulary, flashcard, FSRS, session, or grammar repos.

frontend_architecture:
  owning_slices:
    grammar: app/grammar
    profile: app/profile
  rule: >
    Respect the existing Next.js app-folder and uiflow-local pattern. Keep route
    pages thin and put interaction state in app-local flows/client components.
    Existing grammar edit files are left unchanged because the feature already exists.

  shared_types:
    planned_components:
      - name: LanguageLevel
        placement: src/lib/types/LanguageLevel.ts
        role: union/const list matching backend enum
      - name: GrammarLevelReassignmentSummaryResponse
        placement: src/lib/types/responses/GrammarLevelReassignmentSummaryResponse.ts
        role: summary and changed record shape
      - name: UserProfileResponse
        placement: src/lib/types/responses/UserProfileResponse.ts
        role: userId, difficultyLevel, createdAt, updatedAt
      - name: UpdateUserDifficultyLevelRequest
        placement: src/lib/types/requests/UpdateUserDifficultyLevelRequest.ts
        role: difficultyLevel enum-compatible payload

  grammar_ui:
    existing_components_noop:
      - src/app/grammar/_client_components/EditGrammarRuleView.tsx
      - src/app/grammar/_client_components/GrammarRuleForm.tsx
      - src/app/grammar/_flows/editGrammarRuleFlow.tsx
      - src/app/grammar/_server_actions/editGrammarRuleAction.tsx
    planned_changes:
      - add Reassign Grammar Levels action to grammar list surface
      - display reviewed/changed/unchanged summary and changed records after reassignment
    new_files:
      - src/app/grammar/_server_actions/reassignGrammarLevelsAction.tsx
      - optional src/app/grammar/_flows/reassignGrammarLevelsFlow.tsx if the list flow would become too large

  profile_ui:
    planned_route:
      path: /profile
      page: src/app/profile/page.tsx
    planned_components:
      - name: ProfilePageClient
        placement: src/app/profile/_client_components/ProfilePageClient.tsx
        role: compose profile difficulty flow
      - name: DifficultyLevelSelectorView
        placement: src/app/profile/_client_components/DifficultyLevelSelectorView.tsx
        role: selector, save state, error/success rendering, helper text
      - name: profileDifficultyFlow
        placement: src/app/profile/_flows/profileDifficultyFlow.tsx
        role: fetch profile, update difficulty level, preserve non-reset helper behavior
      - name: fetchUserProfileAction/updateUserDifficultyLevelAction
        placement: src/app/profile/_server_actions
        role: backend API boundary calls

  platform_boundary:
    existing_adapter: src/lib/serverBackedApiCalls.ts
    planned_change:
      - add functions for grammar reassignment and profile endpoints
      - continue using server actions as framework boundary
    dependency_rule: feature flows call server actions; API client remains in lib/server boundary as established by current code.

cross_domain_contract:
  grammar_reassignment:
    method: POST
    path: /api/v1/grammar-rules/reassign-levels/v1
    response:
      reviewedCount: number
      changedCount: number
      unchangedCount: number
      changedRules: array of id, name, previousLevel, proposedLevel, reason
  manual_grammar_edit:
    status: NO-OP
    reason: existing grammar edit feature already exists and user requested no further improvements
  profile:
    read:
      method: GET
      path: /api/v1/users/me/profile
    update_level:
      method: PATCH
      path: /api/v1/users/me/profile/difficulty-level
    difficulty_levels:
      - A1
      - A2
      - B1
      - B2
      - C1

risk_controls:
  - no grammar edit endpoint, service, flow, or UI changes
  - do not touch grammar generation prompts except through new reassignment API
  - keep LLM reassignment as one external-boundary call behind an interface
  - validate LLM output before any grammar rule is saved
  - update only grammar level during reassignment
  - profile update path has no dependencies on progress/session repositories
  - migrations add new profile table only; existing progress tables are untouched
